<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏配置编辑器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@5.5.4/dist/css/tabulator.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>🎮 游戏配置编辑器</h1>
      <div class="header-actions">
        <button id="btn-import" class="btn btn-primary" data-tooltip="导入 Excel/CSV 文件">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          导入文件
        </button>
        <button id="btn-export-json" class="btn btn-secondary" data-tooltip="导出为 JSON 格式">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          导出 JSON
        </button>
        <button id="btn-export-excel" class="btn btn-secondary" data-tooltip="导出为 Excel 格式">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          导出 Excel
        </button>
        <button id="btn-validate" class="btn btn-success" data-tooltip="验证配置数据">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          验证配置
        </button>
      </div>
    </header>

    <main>
      <div id="drop-zone" class="drop-zone">
        <div class="drop-content">
          <div class="drop-icon">📂</div>
          <h2>拖拽文件到此处</h2>
          <p>支持 Excel 和 CSV 格式，或点击"导入文件"按钮选择</p>
          <div class="supported-formats">
            <span class="format-badge">.xlsx</span>
            <span class="format-badge">.xls</span>
            <span class="format-badge">.csv</span>
          </div>
        </div>
        <input type="file" id="file-input" accept=".xlsx,.xls,.csv" style="display: none;">
      </div>

      <div id="table-container" class="table-container" style="display: none;">
        <div id="config-table"></div>
      </div>

      <div id="validation-panel" class="validation-panel" style="display: none;">
        <h3>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          验证结果
        </h3>
        <div id="validation-results"></div>
      </div>
    </main>

    <footer>
      <p>游戏配置编辑器 v1.0 | 支持 Excel/CSV 导入导出 | 实时数据验证</p>
    </footer>
  </div>

  <script src="https://unpkg.com/tabulator-tables@5.5.4/dist/js/tabulator.min.js"></script>
  <script type="module" src="/main.js"></script>
</body>
</html>
