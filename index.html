<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%2309101a'/%3E%3Cpath d='M20 18h24l-7 14h10L20 46l7-14H17z' fill='%237dd2ff'/%3E%3C/svg%3E"
    />
    <title>节点式自动射击 Demo</title>
  </head>
  <body>
    <div id="app">
      <div id="game-shell">
        <div id="phaser-root"></div>
        <div id="ui-root"></div>
      </div>
    </div>
    <script>
      // Lock landscape orientation on mobile
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
      // Prevent pull-to-refresh and overscroll on mobile
      document.body.addEventListener('touchmove', function(e) {
        if (e.target === document.body || e.target === document.documentElement) {
          e.preventDefault();
        }
      }, { passive: false });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
  </html>
